name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-tests:
    name: Python ${{ matrix.py }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12"]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
          cache: pip
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install -r requirements.txt
      - run: node --check skills/analyze-four-pillars-rigorously/scripts/four_pillars_core.js
      - run: python -m json.tool skills/analyze-four-pillars-rigorously/references/rule-registry.json > /dev/null
      - run: python -m json.tool skills/analyze-four-pillars-rigorously/references/provenance-manifest.json > /dev/null
      - run: python -m json.tool skills/analyze-four-pillars-rigorously/references/provider-manifest.json > /dev/null
      - run: python skills/analyze-four-pillars-rigorously/scripts/self_test.py
      - run: python -m unittest tests/test_repository.py -v
